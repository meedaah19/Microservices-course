apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: comments-ingress

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`posts.com`) && PathRegexp(`^/posts/[^/]+/comments$`)
      kind: Rule
      priority: 100
      services:
        - name: comments-srv
          port: 4001