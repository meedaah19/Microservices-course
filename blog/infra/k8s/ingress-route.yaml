apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: blog-ingress

spec:
  entryPoints:
    - web

  routes:
    - match: Host(`posts.com`) && PathPrefix(`/posts/create`)
      kind: Rule
      priority: 300
      services:
        - name: posts-srv
          port: 4000

    - match: Host(`posts.com`) && PathRegexp(`^/posts/[^/]+/comments$`)
      kind: Rule
      priority: 250
      services:
        - name: comments-srv
          port: 4001

    - match: Host(`posts.com`) && PathPrefix(`/posts`)
      kind: Rule
      priority: 100
      services:
        - name: query-srv
          port: 4002